[project]
name = "kortexa-ai-tts"
version = "2.0.0"
description = "OpenAI-compatible text-to-speech server with MLX-Audio and CUDA backends"
authors = [
    { name = "kortexa.ai", email = "francip@kortexa.ai" }
]
keywords = ["tts", "text-to-speech", "openai-compatible", "mlx-audio", "qwen3-tts", "custom-voice", "fastapi", "streaming", "kortexa"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3.5,<2.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
]
# Flash attention for CUDA (reduces VRAM usage)
flash = [
    "flash-attn>=2.8.3.post1",
]
mlx = [
    "mlx-audio @ git+https://github.com/Blaizzy/mlx-audio.git ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
cuda = [
    # Streams audio during generation via CUDA-graph capture; qwen-tts only
    # returns finished waveforms. Preferred at load time, with qwen-tts kept as
    # the fallback (and still the source of the shared model plumbing).
    "faster-qwen3-tts>=0.3.2",
    "qwen-tts>=0.1.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
]

[project.urls]
Homepage = "https://github.com/kortexa-ai/tts.server"
Repository = "https://github.com/kortexa-ai/tts.server.git"
Documentation = "https://github.com/kortexa-ai/tts.server#readme"
"Bug Tracker" = "https://github.com/kortexa-ai/tts.server/issues"

[project.scripts]
"kortexa-tts" = "kortexa.tts.cli:main"

[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.uv]
conflicts = [
    [
        { extra = "mlx" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
